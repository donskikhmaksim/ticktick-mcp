# Реестр сдачи захода 1. Восемнадцать записей, по одной на пункт штатного
# расписания (docs/TZ/ZAHOD1.md, таблица «Восемнадцать пунктов захода 1»).
#
# Реестр — ВХОД для прогона, а не его вывод. Статус в реестре на итог не влияет:
# прогон `python -m zahod1.check --dsn "..."` вычисляет статус сам из git, из
# прогона тестов и из повторно выполненных команд счетовода.
#
# Поля записи:
#   номер                 — ключ строки, менять нельзя;
#   заголовок             — из таблицы задания;
#   автор                 — роль и модель того, кто писал пункт;
#   коммиты               — полные или короткие хеши коммитов пункта;
#   тест_автора           — «файл::имя», один тест;
#   тест_проверяющего     — «файл::имя», найден проверяющим самостоятельно;
#   проверяющий           — роль и модель проверяющего откатом;
#   скептики              — три записи (линзы С-Д, С-Л, С-Г), у каждой путь к отчёту;
#   счетовод              — роль и модель того, кто мерил числа;
#   числа                 — список пар «команда → значение»: что мерим, было, стало, команда;
#   ворота                — время открытия каждых ворот (ворота 2 не принимаются при пустых воротах 1);
#   статус                — одно из трёх: «закрыт», «не закрыт», «остановлен и возвращён владельцу».
#                           Пусто = пункт ещё не заполняли. Любое ИНОЕ значение —
#                           аварийная остановка прогона.
#
# Отчёт скептика обязан содержать либо строку, начинающуюся с «Вход:», либо
# строку, начинающуюся с «Попытка» — иначе он считается отсутствующим
# (задание, ворота 3: «Отчёт скептика без перечня попыток считается отсутствующим»).

