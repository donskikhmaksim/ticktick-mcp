name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    # Настоящий Postgres, а не двойник: тесты долговечных планов (#91)
    # проверяют одноразовость при ОДНОВРЕМЕННОМ захвате, а это свойство самого
    # движка (блокировка строки на UPDATE). Любой самодельный двойник
    # исполняет запросы по очереди и делает такой тест зелёным всегда — см.
    # шапку tests/pg_helper.py. Без этого сервиса они молча пропускаются.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: ticktick_mcp_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: pip install -e .[dev]
      - name: Lint
        run: ruff check .
      - name: Test
        env:
          TICKTICK_TEST_PG_DSN: postgresql://postgres:postgres@127.0.0.1:5432/ticktick_mcp_test?sslmode=disable
        run: pytest

  guide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check GUIDE.md is current with the MCP tool set
        run: python scripts/gen_guide.py --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build image
        run: docker build .
      - name: Shellcheck
        run: |
          sudo apt-get update && sudo apt-get install -y shellcheck
          shellcheck scripts/*.sh
